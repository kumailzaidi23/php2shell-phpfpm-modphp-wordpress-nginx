services:
  db:
    image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
    container_name: php2shell-fpm82-db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wp_lab}
      MARIADB_USER: ${DB_USER:-wp_lab}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/mysql

  fpm:
    build:
      context: ../..
      dockerfile: profiles/fpm82/Dockerfile
      args:
        LOCAL_FLAG: ${LOCAL_FLAG:?set LOCAL_FLAG}
    container_name: php2shell-fpm82
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    depends_on:
      db:
        condition: service_healthy
    environment:
      LAB_DB_HOST: db
      LAB_DB_NAME: ${DB_NAME:-wp_lab}
      LAB_DB_USER: ${DB_USER:-wp_lab}
      LAB_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      LAB_ORIGIN: http://127.0.0.1:${LAB_PORT:-18232}
    volumes:
      - webroot:/var/www/html

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: php2shell-fpm82-nginx
    depends_on:
      - fpm
    ports:
      - "127.0.0.1:${LAB_PORT:-18232}:80"
    volumes:
      - webroot:/var/www/html:ro
      - ../../lab/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  database:
  webroot:
